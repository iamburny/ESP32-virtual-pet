[platformio]
default_envs = esp32-c6-touch-lcd-147

[env:esp32-c6-touch-lcd-147]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_port = COM7
monitor_port = COM7
lib_deps =
    moononournation/GFX Library for Arduino@^1.6.0
    lvgl/lvgl@^8.4.0
    bblanchon/ArduinoJson@^7.2.1
    lewisxhe/SensorLib@^0.3.1
    h2zero/NimBLE-Arduino@^2.3.0
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
test_ignore = *

; Host-side unit tests for the pure game logic in src/pet/pet_sim.cpp.
[env:native]
platform = native
test_build_src = no
build_flags = -std=gnu++17 -I src/pet
test_ignore =
