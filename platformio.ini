[platformio]
default_envs = esp32-c6-touch-lcd-147

; Shared by both boards. Each board env adds its BOARD_* macro and compiles only
; its own driver folder under src/boards/.
[firmware]
lib_deps =
    moononournation/GFX Library for Arduino@^1.6.0
    lvgl/lvgl@^8.4.0
    bblanchon/ArduinoJson@^7.2.1
    h2zero/NimBLE-Arduino@^2.3.0
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<boards/>

; Waveshare ESP32-C6-Touch-LCD-1.47 (172x320, QMI8658 IMU).
[env:esp32-c6-touch-lcd-147]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_port = COM7
monitor_port = COM7
lib_deps =
    ${firmware.lib_deps}
    lewisxhe/SensorLib@^0.3.1
build_flags =
    ${firmware.build_flags}
    -D BOARD_C6_LCD147
build_src_filter = ${firmware.build_src_filter} +<boards/c6_lcd147/>
test_ignore = *

; Guition JC3248W535EN (ESP32-S3, 320x480 AXS15231B, 16MB flash, 8MB OPI PSRAM).
[env:jc3248w535]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_port = COM9
monitor_port = COM9
lib_deps = ${firmware.lib_deps}
build_flags =
    ${firmware.build_flags}
    -D BOARD_JC3248W535
    -D BOARD_HAS_PSRAM
    -D ESP32QSPI_MAX_PIXELS_AT_ONCE=4096
build_src_filter = ${firmware.build_src_filter} +<boards/jc3248w535/>
test_ignore = *

; Host-side unit tests for the pure game logic in src/pet/pet_sim.cpp.
[env:native]
platform = native
test_build_src = no
build_flags = -std=gnu++17 -I src/pet
test_ignore =
